<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <!-- Rich Gold Gradient for Text & Accents -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Metallic Gold Wing Feather Gradient -->
    <linearGradient id="goldWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="30%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Vertical Divider Line Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- LEFT BRAND MARK: TRIPLE LUXURY GOLD FEATHER WINGS (MEDIA 4 SPEC) -->
  <g transform="translate(40, 20)">
    <!-- LEFT WING FEATHERS (3 Sweeping Curved Feathers) -->
    <path d="M 210 260 C 130 180, 70 90, 40 20 C 100 70, 150 160, 210 260 Z" fill="url(#goldWingGrad)" />
    <path d="M 210 260 C 145 195, 95 125, 65 60 C 115 110, 165 185, 210 260 Z" fill="url(#goldWingGrad)" opacity="0.95" />
    <path d="M 210 260 C 160 210, 120 155, 95 105 C 135 150, 175 205, 210 260 Z" fill="url(#goldWingGrad)" opacity="0.88" />

    <!-- RIGHT WING FEATHERS (3 Sweeping Curved Feathers) -->
    <path d="M 210 260 C 290 180, 350 90, 380 20 C 320 70, 270 160, 210 260 Z" fill="url(#goldWingGrad)" />
    <path d="M 210 260 C 275 195, 325 125, 355 60 C 305 110, 255 185, 210 260 Z" fill="url(#goldWingGrad)" opacity="0.95" />
    <path d="M 210 260 C 260 210, 300 155, 325 105 C 285 150, 245 205, 210 260 Z" fill="url(#goldWingGrad)" opacity="0.88" />
  </g>

  <!-- CENTER VERTICAL DIVIDER LINE -->
  <line x1="490" y1="35" x2="490" y2="265" stroke="url(#dividerGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- RIGHT TYPOGRAPHY BLOCK -->
  <g transform="translate(540, 0)">
    <!-- Top Line: "KnK" Serif Luxury Title -->
    <text x="30" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="bold" fill="url(#goldTextGrad)" letter-spacing="-2">
      KnK
    </text>

    <!-- Middle Line: Gold Accent Bars + "AUTOMOTIVE" -->
    <g transform="translate(0, 195)">
      <line x1="0" y1="-8" x2="60" y2="-8" stroke="url(#goldTextGrad)" stroke-width="3" stroke-linecap="round" />
      <text x="75" y="0" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="12">
        AUTOMOTIVE
      </text>
      <line x1="340" y1="-8" x2="400" y2="-8" stroke="url(#goldTextGrad)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Bottom Line: "PREMIUM AUTOMOTIVE SOLUTIONS" -->
    <text x="200" y="245" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#D97706" letter-spacing="5" text-anchor="middle">
      PREMIUM AUTOMOTIVE SOLUTIONS
    </text>
  </g>
</svg>
