<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <defs>
    <linearGradient id="knkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="wingGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Left Gold Wings Mark (Matches Uploaded Admin Logo As Is) -->
  <g transform="translate(10, 5)">
    <!-- Left Wing Feathers -->
    <path d="M 125 135 C 75 90, 45 40, 25 12 C 55 42, 85 85, 125 135 Z" fill="url(#wingGoldGrad)" />
    <path d="M 125 135 C 85 100, 62 65, 48 35 C 72 65, 98 98, 125 135 Z" fill="url(#wingGoldGrad)" opacity="0.9" />
    <path d="M 125 135 C 98 108, 80 82, 70 60 C 90 85, 108 110, 125 135 Z" fill="url(#wingGoldGrad)" opacity="0.8" />

    <!-- Right Wing Feathers -->
    <path d="M 125 135 C 175 90, 205 40, 225 12 C 195 42, 165 85, 125 135 Z" fill="url(#wingGoldGrad)" />
    <path d="M 125 135 C 165 100, 188 65, 202 35 C 178 65, 152 98, 125 135 Z" fill="url(#wingGoldGrad)" opacity="0.9" />
    <path d="M 125 135 C 152 108, 170 82, 180 60 C 160 85, 142 110, 125 135 Z" fill="url(#wingGoldGrad)" opacity="0.8" />
  </g>

  <!-- Right Typography (KnK Serif & PREMIUM AUTOMOTIVE SOLUTIONS) -->
  <g transform="translate(250, 0)">
    <!-- KnK Serif Logo Text -->
    <text x="50" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="bold" fill="url(#knkGoldGrad)" letter-spacing="-1">
      KnK
    </text>

    <!-- Subtitle Accents & Text -->
    <line x1="10" y1="98" x2="45" y2="98" stroke="url(#knkGoldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="27.5" cy="98" r="2.5" fill="#fef08a" />
    
    <line x1="215" y1="98" x2="250" y2="98" stroke="url(#knkGoldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="232.5" cy="98" r="2.5" fill="#fef08a" />

    <text x="130" y="122" font-family="'Inter', 'Montserrat', sans-serif" font-size="11.5" font-weight="700" fill="#d97706" letter-spacing="2.8" text-anchor="middle">
      PREMIUM AUTOMOTIVE SOLUTIONS
    </text>
  </g>
</svg>
