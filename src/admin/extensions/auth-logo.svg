<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="nexusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Hexagon Cyber Icon -->
  <g transform="translate(10, 10)">
    <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="url(#nexusGlow)" filter="url(#shadow)" />
    <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="#08090C" />
    <!-- Inner Z/N Emblem -->
    <path d="M 35 32 L 65 32 L 35 68 L 65 68" stroke="url(#nexusGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="50" cy="50" r="5" fill="#10B981" />
  </g>

  <!-- Typography -->
  <text x="120" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#F8FAFC" letter-spacing="3">
    NEXUS<tspan fill="#3B82F6">.PRIME</tspan>
  </text>
  <text x="122" y="86" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="2">
    BIO-NEURAL &amp; QUANTUM CMS
  </text>
</svg>
